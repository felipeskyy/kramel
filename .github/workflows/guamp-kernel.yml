name: Kernel External Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses-dev \
            zip wget curl git libkmod-dev

      - name: Cache Clang Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: clang-r547379-v1

      - name: Download AOSP Clang
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" \
            -o clang.tar.gz
          mkdir clang
          tar -xf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Clone kernel source
        run: |
          git clone https://github.com/felipeskyy/kernel_motorola_sm6225.git -b lineage-23.1-ak3 kernel_src

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/felipeskyy/AnyKernel3.git anykernel

      - name: Build Kernel
        run: |
          cd kernel_src
          # Merge kernel configs
          ./scripts/kconfig/merge_config.sh \
            arch/arm64/configs/vendor/bengal-perf_defconfig \
            arch/arm64/configs/vendor/ext_config/moto-bengal.config \
            arch/arm64/configs/vendor/ext_config/guamp-default.config
          cp .config arch/arm64/configs/vendor/guamp-perf_defconfig

          # Set environment for compilation
          export PATH="$PWD/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Clean and build
          make mrproper
          make O=out ARCH=arm64 vendor/guamp-perf_defconfig
          make O=out -j$(nproc --all)

      - name: Setup AnyKernel
        run: |
          cd kernel_src
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ../anykernel/
            find out/ -type f -name "*.ko" -exec cp {} ../anykernel/modules/vendor/lib/modules/ \;
          else
            exit 1
          fi

          # Set build date
          DATE=$(date +'%Y%m%d')
          echo "DATE=$DATE" >> $GITHUB_ENV

          # Zip
          cd ../anykernel
          zip -r9 ../lineage-23.1-kernel_${DATE}.zip ./*

      - name: Upload ZIP to GoFile
        run: |
          wget https://raw.githubusercontent.com/GustavoMends/go-up/master/go-up
          chmod +x go-up
          ./go-up lineage-23.1-kernel_${{ env.DATE }}.zip
